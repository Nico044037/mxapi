<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}</style>
</head>
<body>
<script>
(async () => {
  const url = 'https://github.com/Nico044037/mxapi/releases/download/releases/Project_H_Anmeldeformular.pdf';
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Download failed');
    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = 'Project_H_Anmeldeformular.pdf';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
  } catch (_) {
    // Fallback: open the release file directly if browser cross-origin rules block fetch.
    window.location.replace(url);
  }
})();
</script>
</body>
</html>
