<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}</style>
</head>
<body>
<script>
(() => {
  const fileUrl = 'https://github.com/Nico044037/mxapi/releases/download/releases/Project_H_Anmeldeformular.pdf';
  const fileName = 'Project_H_Anmeldeformular.pdf';

  // A direct browser navigation avoids fetch/CORS errors. A static page cannot
  // reliably verify that the browser finished saving a cross-origin download.
  let statusWindow = null;
  try { statusWindow = window.open('', 'projectHDownloadStatus', 'width=480,height=340,resizable=yes'); } catch (_) {}

  function renderStatus() {
    if (!statusWindow || statusWindow.closed) return;
    statusWindow.document.open();
    statusWindow.document.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project H Download Status</title><style>
      body{font:16px system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding:24px;background:#f5f7fa;color:#182230}
      main{background:#fff;border:1px solid #dce2ea;border-radius:14px;padding:24px;max-width:420px;margin:auto}
      .badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;background:#fef3c7;color:#92400e}
      h1{font-size:22px;margin:16px 0 8px}p{line-height:1.5;color:#465365;overflow-wrap:anywhere}
      a,button{display:inline-block;margin:8px 8px 0 0;border:0;border-radius:8px;padding:10px 14px;background:#182230;color:white;font:inherit;text-decoration:none;cursor:pointer}
      a{background:#166534}
    </style></head><body><main><span class="badge">DOWNLOAD REQUESTED</span><h1>Check your downloads</h1><p>Your browser has been sent a direct request for <strong>${fileName}</strong>. This page cannot confirm whether the browser finished saving the file. If no download appeared, use the direct link below.</p><a href="${fileUrl}" target="_blank" rel="noopener">Download PDF from GitHub</a><button onclick="window.close()">Close window</button></main></body></html>`);
    statusWindow.document.close();
    statusWindow.focus();
  }

  renderStatus();
  // Trigger the file URL directly; do not fetch it, because GitHub's cross-origin
  // response may not permit JavaScript to read it (CORS).
  const link = document.createElement('a');
  link.href = fileUrl;
  link.target = '_blank';
  link.rel = 'noopener';
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => { try { window.close(); } catch (_) {} }, 1000);
})();
</script>
</body>
</html>
